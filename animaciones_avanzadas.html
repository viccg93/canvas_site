<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animaciones avanzadas</title>
    <link rel="stylesheet" href="bulma.min.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <h3>animaciones avanzadas</h3>
            <p>
                en la seccion de animaciones basicas ya se vio como se pueden realizar algunas animaciones,
                ahora se va a añadir fisica para tener animaciones mas realistas.
            </p>
            <canvas id="ball1" width="500" height="300"></canvas>
        </div>
    </div>
    <script>
        let canvas = document.getElementById('ball1');
        var raf;
        let running = false, idle = false;
        class Ball{
            constructor(x,y,radius,color,vx,vy){
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.vx = vx;
                this.vy = vy;
            }

            drawBall(context){
                context.beginPath();
                context.arc(this.x,this.y,this.radius,0,Math.PI*2,false);
                context.closePath();
                context.fillStyle = this.color;
                context.fill();
            }

            calculateNewCords(){
                if(this.x + this.vx + this.radius > canvas.width || this.x + this.vx - this.radius < 0){
                    this.vx = -this.vx;
                }
                if(this.y + this.vy + this.radius > canvas.height || this.y + this.vy - this.radius < 0){
                    this.vy = -this.vy;
                }
                this.x += this.vx;
                this.y += this.vy;
                this.vy *= .99;
                this.vy += .25;
            }
        }
        class Orquestador{
            constructor(numBalls){
                this.canvasWidth = canvas.width;
                this.canvasHeight = canvas.height;
                this.context = canvas.getContext('2d');
                this.ballsArray = [];
                for(let i=0; i< numBalls;i++){
                    this.ballsArray.push(new Ball(40 +(Math.random()*(this.canvasWidth-70)),40 + (Math.random()*(this.canvasHeight-70)),30,'blue',Math.random()*5,Math.random()*5));
                }
            }

            draw(running){
                //alternativa a clearRect, que permite el efecto de trailing
                this.clear();
                this.ballsArray.forEach((ball)=>{
                    if(running){
                        ball.calculateNewCords();
                    }
                    ball.drawBall(this.context);
                });
            }

            updateCords(x,y){
                this.ballsArray.forEach((ball)=>{
                    ball.x=x;
                    ball.y=y;
                });
            }

            clear(){
                this.context.fillStyle = 'rgba(255, 255, 255, 0.3)';
                this.context.fillRect(0, 0, this.canvasWidth, this.canvasHeight);
            }
            
            agresiveClear(){
                this.context.clearRect(0, 0, this.canvasWidth, this.canvasHeight);
            }
        }

        let orquestador = new Orquestador(7);

        function animate(){
            orquestador.draw(running);
            raf = window.requestAnimationFrame(animate);
        }

        canvas.addEventListener('mousemove',(e)=>{
            let measures = canvas.getBoundingClientRect();
            if(running == false){
                //orquestador.clear();
                orquestador.updateCords(e.clientX-measures.left,e.clientY-measures.top);
                orquestador.draw(running);
                //raf = window.requestAnimationFrame(animate);
            }
        });

        canvas.addEventListener('click',(e)=>{
            if(running == false){
                running = true;
                idle = false;
                raf = window.requestAnimationFrame(animate);
            }else{
                window.cancelAnimationFrame(raf);
                running = false;
                idle = false;
                let measures = canvas.getBoundingClientRect();
                orquestador.agresiveClear();
                orquestador.updateCords(e.clientX-measures.left,e.clientY-measures.top);
                orquestador.draw(running);
            }
            
        });

    
        canvas.addEventListener('mouseover',()=>{
            if(running == true && idle == true){
                raf = window.requestAnimationFrame(animate);
            }
            
        });

        canvas.addEventListener('mouseout',()=>{
            if(running == true){
                idle = true;
                window.cancelAnimationFrame(raf);
            }
            
        });

        orquestador.draw(running);
        
    </script>
</body>
