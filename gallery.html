<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria</title>
    <link rel="stylesheet" href="gllery.css">
</head>
<body onload="draw();">
    <table>
        <thead></thead>
        <tbody>
            <tr>
                <td><img src="./art3.jpeg" alt=""></td>
                <td><img src="./art4.jpeg" alt=""></td>
                <td><img src="./art2.png" alt=""></td>
                <td><img src="./art5.jpeg" alt=""></td>
            </tr>
            <tr>
                <td><img src="./art6.jpeg" alt=""></td>
                <td><img src="./art7.jpeg" alt=""></td>
                <td><img src="./art8.jpeg" alt=""></td>
                <td><img src="./art9.jpeg" alt=""></td>
            </tr>
        </tbody>
    </table>
    <img id="frame" src="./canvas_picture_frame.png" alt="">
</body>
<script>
    function draw(){
        let images = document.images;
        let frame = document.getElementById('frame');
        for(let i=0; i< images.length; i++){
            //como el array de imagenes contiene tambien el marco, no debemos tomar este como parte de la galeria
            if(images[i].id != 'frame'){
                let canvas = document.createElement('canvas');
                canvas.setAttribute('width',132);
                canvas.setAttribute('height',150);
                //con parentNode nos posicionamos en el td y con insertBefore le indicamos que inserte el canvas antes del img
                images[i].parentNode.insertBefore(canvas,images[i]);
                let ctx = canvas.getContext('2d');
                ctx.drawImage(images[i],15,20,102,110);
                ctx.drawImage(frame,0,0);
            }
        }
    }
</script>
</html>
